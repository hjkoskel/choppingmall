MEMORY {
  ZP:     file = "", start = $0002, size = $00FE, type = rw;
  OAM:    file = "", start = $0200, size = $0100, type = rw;
  RAM:    file = "", start = $0300, size = $0400, type = rw;
  HEADER: file = %O, start = $0000, size = $0010, fill = yes;
  PRG:    file = %O, start = $8000, size = $7FFA, fill = yes, fillval = $FF;
  VECT:   file = %O, start = $FFFA, size = $0006, fill = yes;
  CHR:    file = %O, start = $0000, size = $2000, fill = yes;
}
SEGMENTS {
  ZEROPAGE: load = ZP,  type = zp;
  OAM:      load = OAM, type = bss, optional = yes;
  BSS:      load = RAM, type = bss, define = yes;
  HEADER:   load = HEADER, type = ro;
  STARTUP:  load = PRG, type = ro;
  CODE:     load = PRG, type = ro;
  RODATA:   load = PRG, type = ro;
  DATA:     load = PRG, run = RAM, type = rw, define = yes;
  VECTORS:  load = VECT, type = ro;
  CHARS:    load = CHR, type = ro, optional = yes;
}
SYMBOLS {
  __STACKSTART__: type = export, value = $0700;
  __STACKSIZE__:  type = export, value = $0100;
}
